name: Debian packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Ubuntu 24.04 / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y debhelper dpkg-dev fakeroot build-essential python3 ca-certificates
      - name: Test package construction
        run: make test-deb
      - name: Build source package
        run: make deb
      - name: Check binary version and checksum
        run: |
          set -euo pipefail
          cd dist/ubuntu
          sha256sum --check ./*.deb.sha256
          dpkg-deb --extract ./*.deb unpacked
          raw=$(cat ../../VERSION)
          unpacked/usr/bin/hyperliquid-exporter --version | tee version.txt
          grep -F "version ${raw#v} (commit $GITHUB_SHA," version.txt
      - uses: actions/upload-artifact@v6
        with:
          name: hyperliquid-exporter-noble-${{ matrix.arch }}
          path: |
            dist/ubuntu/*.deb
            dist/ubuntu/*.deb.sha256
            dist/ubuntu/*.deb.build-info.json
          if-no-files-found: error
