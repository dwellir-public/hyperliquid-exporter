name: CI Tests

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

# PR runs are superseded by the next push to the same PR; pushes to main each
# get a unique group so they neither cancel nor serialize one another.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  golangci:
    name: Golang CI lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  unit-tests-race:
    name: Unit tests (race)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test -mod=readonly ./... -count=1 -shuffle=on -race

  unit-tests-flaky:
    name: Unit tests (flaky)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test -mod=readonly ./... -count=16 -shuffle=on

  govulncheck:
    name: Vulnerability scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - run: govulncheck ./...

  summary:
    name: CI Summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    needs: [golangci, unit-tests-race, unit-tests-flaky, govulncheck]
    if: always() # Always run, even if earlier jobs fail
    steps:
      - name: Write CI summary
        run: |
          {
            echo "## 🧪 CI Test Summary"
            echo ""
            echo "- **Lint:** ${{ needs.golangci.result }}"
            echo "- **Unit (race):** ${{ needs.unit-tests-race.result }}"
            echo "- **Unit (flaky):** ${{ needs.unit-tests-flaky.result }}"
            echo "- **Vuln scan:** ${{ needs.govulncheck.result }}"
            echo ""
            echo "### Commit"
            echo "[${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo ""
            echo "Triggered by: @${{ github.actor }}"
            echo "Event: \`${{ github.event_name }}\`"
            echo ""
            echo "[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
